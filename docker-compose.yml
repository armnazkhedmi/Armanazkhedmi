services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: armnaz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - armnaz_pg:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/armnaz
      JWT_SECRET: change-this-in-production
      CORS_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on: [db]
volumes:
  armnaz_pg:
